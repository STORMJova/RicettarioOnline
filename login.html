<!DOCTYPE html>
<html lang="it">    
<head>
    <title>Ricettario Online</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="stile/stile.css">
    <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,300,600,700,800' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Sigmar+One' rel='stylesheet' type='text/css'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/scripts.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="hamburger" id="hamburger-btn">☰</div>
            <div class="mobile-title">RICETTARIO</div>
            
            <ul class="nav-links">
                <li><a href="home.html">HOME</a></li>
                <li><a href="ricette.html">RICETTE</a></li>
                <li><a href="chi_siamo.html">CHI SIAMO</a></li>
                <li><a href="contatti.html">CONTATTI</a></li>
            </ul>
            <div class="user-menu">
                <a href="login.html" class="user-icon"><img src="images/login.jpg" alt="Login"></a>
            </div>
        </nav>

        <h1>Ricettario</h1>

    </header>

    <main class="login-page">
        <div class="login-card">
            <h2 class="login-title" id="titolo-card">Bentornato!</h2>
            <p class="login-subtitle" id="sottotitolo-card">Accedi per salvare le tue ricette preferite</p>

            <p id="messaggio-errore" class="error-msg"></p>

            <form action="/api/login" method="POST" id="form-login">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-submit">ACCEDI</button>
                
                <div class="login-footer">
                    <p>Non hai un account? <a href="#" id="link-registrati">Registrati ora</a></p>
                </div>
            </form>

            <form action="/api/register" method="POST" id="form-register" class="nascosto">
                <div class="input-group">
                    <label for="reg-username">Scegli Username</label>
                    <input type="text" id="reg-username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="reg-password">Scegli Password</label>
                    <input type="password" id="reg-password" name="password" required>
                </div>
                <button type="submit" class="btn-submit">CREA ACCOUNT</button>
                
                <div class="login-footer">
                    <p>Hai già un account? <a href="#" id="link-login">Torna al Login</a></p>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <nav>
            <ul>
                <li><a href="#">Advertise</a></li>
                <li><a href="#">Cookie Policy</a></li>
                <li><a href="#">Terms of Service</a></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
